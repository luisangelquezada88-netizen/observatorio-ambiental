name: ci

# Portero rápido: valida código sin extraer nada (datos sintéticos, sin red).
on:
  push:
    branches: [main]
    paths-ignore: ["lake/**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Compilación
        run: python -m compileall -q src dags tests scripts
      - name: Tests
        run: pytest tests/ -q
      - name: Smoke dashboard (sin Quarto)
        run: python scripts/smoke_qmd.py
