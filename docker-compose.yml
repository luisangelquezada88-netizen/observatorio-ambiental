services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: ambiental-postgis
    environment:
      POSTGRES_DB: ${POSTGIS_DB:-ambiental}
      POSTGRES_USER: ${POSTGIS_USER:-ambiental}
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD:-ambiental_dev}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ambiental}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    profiles: ["minio"]  # Opcional H0: registry con auth; lake local ya es S3-compatible. Ver D-07.
    container_name: ambiental-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: ambiental-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgis:
        condition: service_healthy

  airflow:
    image: apache/airflow:2.10.4-python3.11
    container_name: ambiental-airflow
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      _PIP_ADDITIONAL_REQUIREMENTS: "duckdb>=0.10.0 pandas>=2.2 pyarrow>=15.0 requests>=2.31 psycopg[binary]>=3.1 shapely>=2.0"
      PYTHONPATH: /opt/src
      POSTGIS_HOST: postgis
      POSTGIS_PORT: 5432
      POSTGIS_DB: ${POSTGIS_DB:-ambiental}
      POSTGIS_USER: ${POSTGIS_USER:-ambiental}
      POSTGIS_PASSWORD: ${POSTGIS_PASSWORD:-ambiental_dev}
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/src/src:ro
      - ./dashboard:/opt/src/dashboard:ro
      - ./lake:/opt/src/lake
      - ./sql:/opt/src/sql:ro
      - airflowdata:/opt/airflow
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --password admin --firstname Admin --lastname Local --role Admin --email admin@local.dev || true &&
               airflow standalone"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
  miniodata:
  airflowdata:
